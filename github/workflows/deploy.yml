name: Deploy to Firebase

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # यह लाइन जोड़ें (Error fix के लिए)
      pages: write      # यह भी जोड़ें
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting,firestore:rules,storage:rules --project distilleryhub-b1d2d --token "${{ secrets.FIREBASE_TOKEN }}"
