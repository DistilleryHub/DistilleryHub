<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DistilleryHub</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      // Fixes "404 on refresh" for any deep link like /DistilleryHub/chat by
      // bouncing through this page, encoding the real path into a query string,
      // then index.html's decode script (see index.html <head>) restores it.
      var pathSegmentsToKeep = 1; // keep "/DistilleryHub" — matches vite.config.js base

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
