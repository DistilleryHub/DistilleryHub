<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#0b1420">
<title>DistilleryHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b1420; --surface: #101c29; --card: #152332; --border: #22334a;
  --text: #eef3f6; --text-dim: #8ca0b3; --copper: #d98b3f; --copper-bright: #f0a559;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; height: 100%; }

/* UTILS */
.hidden { display: none !important; }
.spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--copper-bright); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* APP WRAPPER */
#app { display: none; min-height: 100vh; flex-direction: column; }
#app.show { display: flex; }

/* TOPBAR */
.topbar { position: sticky; top: 0; background: rgba(11,20,32,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
.brand { color: var(--copper-bright); font-family: 'Fraunces'; font-weight: bold; font-size: 20px; }
.top-actions { display: flex; gap: 15px; align-items: center; }

/* MAIN CONTENT */
.content { flex: 1; padding: 20px 15px 100px; max-width: 900px; margin: 0 auto; width: 100%; }

/* NAVTAB SYSTEM */
.navtab-row { display: flex; gap: 5px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
.tab-btn { background: none; border: none; color: var(--text-dim); font-weight: 600; padding: 8px 15px; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.tab-btn.active { color: var(--copper-bright); background: var(--card); border: 1px solid var(--border); }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }

/* BOTTOM NAV MOBILE */
.bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--surface); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid var(--border); z-index: 99; }
.bottom-nav button { background: none; border: none; color: var(--text-dim); font-size: 11px; font-weight: bold; }
.bottom-nav button.active { color: var(--copper-bright); }
</style>
</head>
<body>

  <!-- 1. FULL LOADING -->
  <div id="authLoading" style="height:100vh; display:flex; justify-content:center; align-items:center;">
    <span class="spinner"></span>
  </div>

  <!-- 2. LOGIN UI -->
  <div id="authScreen" class="hidden" style="height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="card" style="width:100%; max-width:350px; text-align:center;">
        <h1 style="color:var(--copper-bright); font-family: 'Fraunces';">DH</h1>
        <p>Login to DistilleryHub</p>
        <button id="btnGoogleLogin" style="width:100%; padding:12px; border-radius:8px; border:none; cursor:pointer; font-weight:700;">Google Se Continue Karein</button>
    </div>
  </div>

  <!-- 3. MAIN APP UI -->
  <div id="app">
    <div class="topbar">
       <div class="brand">DH</div>
       <div class="top-actions">
         <span id="nav-indicator" style="font-size: 12px; opacity:0.5">Feed</span>
         <div id="avatarWrap" style="width:34px; height:34px; border-radius:50%; background:var(--border); border:2px solid var(--border); cursor:pointer;"></div>
       </div>
    </div>

    <div class="content">
      <!-- Tabs Row -->
      <div class="navtab-row">
          <button class="tab-btn active" id="tab-feed" onclick="switchTab('feed')">Feed</button>
          <button class="tab-btn" id="tab-chat" onclick="switchTab('chat')">Messages</button>
          <button class="tab-btn" id="tab-network" onclick="switchTab('network')">Network</button>
      </div>

      <!-- Display Panels -->
      <div id="panel-feed" class="tab-view">
          <div id="feedContent"></div>
      </div>

      <div id="panel-chat" class="tab-view hidden">
          <div class="card"><p>Aapke Messages yahan dikhenge...</p></div>
      </div>

      <div id="panel-network" class="tab-view hidden">
          <div class="card"><p>Professional Network Search...</p></div>
      </div>
    </div>

    <!-- Mobile Nav Bar -->
    <div class="bottom-nav">
        <button onclick="switchTab('feed')" id="bnav-feed" class="active">FEED</button>
        <button onclick="switchTab('chat')" id="bnav-chat">CHAT</button>
        <button onclick="switchTab('network')" id="bnav-network">PRO</button>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyB63lPTtic1RUjfq-KXWrvtisSGIetXL6k",
  authDomain: "distilleryhub-b1d2d.firebaseapp.com",
  projectId: "distilleryhub-b1d2d",
  storageBucket: "distilleryhub-b1d2d.firebasestorage.app",
  messagingSenderId: "221084904588",
  appId: "1:221084904588:web:f1c47a722b2a7c98509fa9"
};

// Initialize
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.currentUser = null;
let currentUnsub = null;

// Tab Switcher
window.switchTab = (tab) => {
    // Hide all
    document.querySelectorAll('.tab-view').forEach(v => v.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));

    // Show selected
    document.getElementById('panel-' + tab).classList.remove('hidden');
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('bnav-' + tab).classList.add('active');
    document.getElementById('nav-indicator').textContent = tab.toUpperCase();

    if(tab === 'feed') startFeedListener();
    if(currentUnsub && tab !== 'feed') { currentUnsub(); currentUnsub = null; }
};

// Feed System
function startFeedListener() {
    if(currentUnsub) currentUnsub();
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(20));
    currentUnsub = onSnapshot(q, (snap) => {
        const feedDiv = document.getElementById('feedContent');
        let html = '';
        snap.forEach(d => {
            const p = d.data();
            html += `
            <div class="card">
              <strong style="color:var(--copper-bright)">${p.authorName || 'Member'}</strong>
              <div style="margin-top:10px;">${p.text || ''}</div>
              ${p.imageURL ? `<img src="${p.imageURL}" style="width:100%; border-radius:10px; margin-top:15px;">` : ''}
            </div>`;
        });
        feedDiv.innerHTML = html || `<p style="text-align:center; opacity:0.5;">Koi post nahi mila.</p>`;
    });
}

// Auth Handlers
onAuthStateChanged(auth, (user) => {
    const loading = document.getElementById('authLoading');
    const screen = document.getElementById('authScreen');
    const appUi = document.getElementById('app');

    loading.classList.add('hidden');
    if (user) {
        window.currentUser = user;
        screen.classList.add('hidden');
        appUi.classList.add('show');
        if(user.photoURL) document.getElementById('avatarWrap').style.background = `url(${user.photoURL}) center/cover`;
        switchTab('feed');
    } else {
        screen.classList.remove('hidden');
        appUi.classList.remove('show');
    }
});

// Buttons
document.getElementById('btnGoogleLogin').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
document.getElementById('avatarWrap').onclick = () => { if(confirm("Log Out?")) signOut(auth); };

</script>
</body>
</html>
