<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="theme-color" content="#0b1420">
<title>DistilleryHub | Professional Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* CORE CSS - DISTILLERYHUB THEME */
:root {
  --bg:#0b1420; --surface:#101c29; --card:#152332; --card-2:#182838;
  --border:#22334a; --text:#eef3f6; --text-dim:#8ca0b3;
  --copper:#d98b3f; --copper-bright:#f0a559; --radius:12px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; overflow-x:hidden; }
.hidden { display:none !important; }

/* LOADING SCREEN */
#authLoading { height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.spinner { width:25px; height:25px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--copper-bright); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* APP LAYOUT */
#app { display:none; min-height:100vh; }
#app.show { display:block; }
.topbar { position:sticky; top:0; z-index:50; background:rgba(11,20,32,0.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:10px 20px; display:flex; align-items:center; gap:20px; }
.main { max-width:1180px; margin:0 auto; padding:20px 15px; }

/* CARD & FEED */
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:15px; }
.post-name { font-weight:700; color:var(--copper-bright); }
.post-text { margin-top:8px; line-height:1.5; }
.post-img img { width:100%; border-radius:10px; margin-top:10px; }

/* NAVTABS */
.navtabs { display:flex; gap:10px; flex:1; overflow-x:auto; }
.navtab { background:none; border:none; color:var(--text-dim); padding:10px; font-weight:600; cursor:pointer; white-space:nowrap; }
.navtab.active { color:var(--copper-bright); background:var(--card-2); border-radius:8px; }

/* TOAST */
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card-2); border:1px solid var(--border); color:#fff; padding:10px 20px; border-radius:25px; opacity:0; transition:0.3s; z-index:1000; }
#toast.show { opacity:1; }
</style>
</head>
<body>

  <!-- LOADING OVERLAY -->
  <div id="authLoading">
    <div class="spinner"></div>
    <p style="margin-top:15px; opacity:0.6;">Connecting...</p>
  </div>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="hidden" style="display:flex; justify-content:center; align-items:center; min-height:100vh;">
      <div class="card" style="width:340px; text-align:center;">
          <h2 style="color:var(--copper-bright)">DH Login</h2>
          <p style="font-size:12px; opacity:0.7">DistilleryHub Professional Access</p>
          <button id="btnGoogle" style="width:100%; padding:12px; border-radius:8px; cursor:pointer; background:#fff; color:#000; font-weight:700;">Google Se Continue Karein</button>
      </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <div class="topbar">
      <div style="font-weight:900; font-size:22px; color:var(--copper-bright)">DH</div>
      <div class="navtabs">
         <button class="navtab active" data-tab="feed" onclick="switchTab('feed')">Feed</button>
         <button class="navtab" data-tab="chat" onclick="switchTab('chat')">Messages</button>
         <button class="navtab" data-tab="network" onclick="switchTab('network')">Network</button>
      </div>
      <div id="userPhoto" style="width:36px; height:36px; background:var(--card-2); border-radius:50%; border:1px solid var(--border); cursor:pointer;"></div>
    </div>

    <div class="main">
        <div id="panel-feed" class="tabpanel">
            <div id="feedList"></div>
        </div>
        <div id="panel-chat" class="tabpanel hidden">
            <div class="card"><p>Messages are loading...</p></div>
        </div>
        <div id="panel-network" class="tabpanel hidden">
            <div id="networkList"></div>
        </div>
    </div>
  </div>

  <div id="toast"></div>

<script type="module">
// --- STEP 1: ALL IMPORTS AT TOP ---
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// --- STEP 2: CONFIG & INIT ---
const firebaseConfig = {
  apiKey: "AIzaSyB63lPTtic1RUjfq-KXWrvtisSGIetXL6k",
  authDomain: "distilleryhub-b1d2d.firebaseapp.com",
  projectId: "distilleryhub-b1d2d",
  storageBucket: "distilleryhub-b1d2d.firebasestorage.app",
  messagingSenderId: "221084904588",
  appId: "1:221084904588:web:f1c47a722b2a7c98509fa9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// GLOBAL STATE
window.currentUser = null;
let currentListeners = [];

// UTILS
window.toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = "show";
  setTimeout(() => t.className = "", 3000);
}

const cleanup = () => {
    currentListeners.forEach(u => u());
    currentListeners = [];
}

// --- STEP 3: FUNCTION LOGIC ---
window.switchTab = (tab) => {
    cleanup();
    document.querySelectorAll('.tabpanel').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('.navtab').forEach(b => b.classList.remove('active'));
    
    document.getElementById('panel-' + tab).classList.remove('hidden');
    document.querySelector(`.navtab[data-tab="${tab}"]`).classList.add('active');

    if (tab === 'feed') startFeed();
};

const startFeed = () => {
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(30));
    const unsub = onSnapshot(q, (snap) => {
        let html = '';
        snap.forEach(doc => {
            const p = doc.data();
            html += `
              <div class="card">
                <div class="post-name">${p.authorName || 'Professional'}</div>
                <div class="post-text">${p.text || ''}</div>
                ${p.imageURL ? `<div class="post-img"><img src="${p.imageURL}"></div>` : ''}
              </div>`;
        });
        document.getElementById('feedList').innerHTML = html || '<div class="card">Abhi koi post nahi hai.</div>';
    }, (err) => console.log("Feed Error:", err));
    currentListeners.push(unsub);
};

// LOGIN BUTTON
document.getElementById('btnGoogle').onclick = async () => {
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    } catch (e) {
      toast("Login failed! Internet check karein.");
    }
}

// PROFILE LOGOUT
document.getElementById('userPhoto').onclick = () => {
    if(confirm("Sign out karein?")) signOut(auth);
};

// --- STEP 4: AUTH OBSERVER (MAGIC HUB) ---
onAuthStateChanged(auth, async (user) => {
    const loadEl = document.getElementById('authLoading');
    const appEl = document.getElementById('app');
    const authEl = document.getElementById('authScreen');

    if (user) {
        window.currentUser = user;
        loadEl.classList.add('hidden');
        authEl.classList.add('hidden');
        appEl.classList.add('show');
        if(user.photoURL) document.getElementById('userPhoto').style.backgroundImage = `url(${user.photoURL})`;
        switchTab('feed');
    } else {
        loadEl.classList.add('hidden');
        appEl.classList.remove('show');
        authEl.classList.remove('hidden');
    }
});

</script>
</body>
</html>
