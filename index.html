<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistilleryHub</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">DH</div>
            <h2>DistilleryHub</h2>
            <p>Professional Network for Distillery & Ethanol Experts</p>
            <input type="email" id="signinEmail" placeholder="Email">
            <input type="password" id="signinPassword" placeholder="Password">
            <button id="signinBtn" onclick="handleSignIn()">Sign In</button>
            <button onclick="handleGoogleSignIn()">Continue with Google</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="app-shell" style="display:none;">
        <div class="topbar">
            <div class="brand"><div class="brand-icon">DH</div><div class="brand-name">DistilleryHub</div></div>
            <div class="top-actions">
                <button onclick="switchTab('feed')">Feed</button>
                <button onclick="switchTab('network')">Network</button>
                <button onclick="switchTab('jobs')">Jobs</button>
                <button onclick="switchTab('articles')">Articles</button>
                <button onclick="switchTab('market')">Market</button>
                <button onclick="switchTab('videos')">Videos</button>
                <button onclick="switchTab('status')">Status</button>
                <button onclick="switchTab('chat')">Chat</button>
                <button onclick="handleSignOut()">Logout</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <div class="side-card">
                    <div class="side-avatar">U</div>
                    <div class="side-name" id="sideName">User</div>
                    <div class="side-headline" id="sideHeadline">Distiller</div>
                    <button class="btn btn-primary btn-block" onclick="openProfile()">Edit Profile</button>
                </div>
            </div>

            <div class="content">
                <div id="panel-feed" class="panel active">
                    <div class="composer">
                        <textarea id="postText" placeholder="Share an update..."></textarea>
                        <div class="composer-actions">
                            <button onclick="document.getElementById('postImgInput').click()">📷 Photo</button>
                            <input type="file" id="postImgInput" accept="image/*" style="display:none;">
                            <button class="btn-primary" onclick="submitPost()">Post</button>
                        </div>
                    </div>
                    <div id="feedList" class="feed-list"></div>
                </div>

                <div id="panel-jobs" class="panel" style="display:none;">
                    <button class="btn-primary" onclick="postJob()">+ Post a Job</button>
                    <div id="jobsList" class="feed-list" style="margin-top:10px;"></div>
                </div>

                <div id="panel-articles" class="panel" style="display:none;">
                    <button class="btn-primary" onclick="postArticle()">+ Write Article</button>
                    <div id="articlesList" class="feed-list" style="margin-top:10px;"></div>
                </div>

                <div id="panel-market" class="panel" style="display:none;">
                    <button class="btn-primary" onclick="postMarket()">+ List Item</button>
                    <div id="marketList" class="feed-list" style="margin-top:10px;"></div>
                </div>

                <div id="panel-videos" class="panel" style="display:none;">
                    <button class="btn-primary" onclick="postVideo()">+ Add Video</button>
                    <div id="videosList" class="feed-list" style="margin-top:10px;"></div>
                </div>

                <div id="panel-status" class="panel" style="display:none;">
                    <div class="composer">
                        <textarea id="statusText" placeholder="What's happening?"></textarea>
                        <div class="composer-actions"><button class="btn-primary" onclick="submitStatus()">Post Status</button></div>
                    </div>
                </div>

                <div id="panel-chat" class="panel" style="display:none;">
                    <div class="chat-interface">
                        <div class="chat-list" id="convoList"></div>
                        <div class="chat-window">
                            <div class="chat-header" id="chatHeader">Select a conversation</div>
                            <div class="chat-messages" id="chatMessages"></div>
                            <div class="input-area">
                                <button id="btnChatAttach" style="background:none; border:none; font-size:20px; cursor:pointer;">📎</button>
                                <input type="file" id="chatImgInput" accept="image/*" style="display:none;">
                                <input type="text" id="chatInput" placeholder="Write a message...">
                                <button onclick="sendChatMessage()">➤</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { auth } from './js/firebase-init.js';

        // AUTH
        window.handleSignIn = async function() {
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;
            try {
                const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                alert('Login Successful');
            } catch (e) { alert('Login Failed: ' + e.message); }
        };

        window.handleGoogleSignIn = async function() {
            try {
                const { GoogleAuthProvider, signInWithPopup } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
                await signInWithPopup(auth, new GoogleAuthProvider());
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                alert('Login Successful');
            } catch (e) { alert('Login Failed: ' + e.message); }
        };

        window.handleSignOut = async function() {
            const { signOut } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
            await signOut(auth);
            document.getElementById('app').style.display = 'none';
            document.getElementById('authScreen').style.display = 'block';
        };

        // TABS
        window.switchTab = function(tab) {
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            document.getElementById('panel-' + tab).style.display = 'block';
        };

        // POST
        window.submitPost = async function() {
            const text = document.getElementById('postText').value.trim();
            const imgInput = document.getElementById('postImgInput');
            const file = imgInput && imgInput.files[0];
            if (!text && !file) return alert('कुछ लिखो या फोटो चुनो');
            let imageURL = '';
            if (file) {
                const { uploadFile } = await import('./js/upload.js');
                try { imageURL = await uploadFile(file); } catch (e) { return alert('Upload failed: ' + e.message); }
            }
            const { postText } = await import('./js/feed.js');
            await postText(text, imageURL);
            document.getElementById('postText').value = '';
            if (imgInput) imgInput.value = '';
        };

        // STATUS
        window.submitStatus = async function() {
            const text = document.getElementById('statusText').value.trim();
            if (!text) return alert('कुछ लिखो');
            const { postStatus } = await import('./js/status.js');
            await postStatus(text);
            document.getElementById('statusText').value = '';
            alert('Status posted!');
        };

        // CHAT SEND (TEXT)
        window.sendChatMessage = async function() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            if (!window.currentConvoId) return alert('पहले चैट सेलेक्ट करो');
            const { sendMessage } = await import('./js/chat.js');
            await sendMessage(window.currentConvoId, text, '');
            input.value = '';
        };

        // + BATTON (FIXED HERE)
        const btnAttach = document.getElementById('btnChatAttach');
        if (btnAttach) {
            btnAttach.addEventListener('click', () => {
                document.getElementById('chatImgInput').click();
            });
        }

        // PHOTO SELECTION
        document.getElementById('chatImgInput').addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;
            if (!window.currentConvoId) { alert('पहले चैट सेलेक्ट करो'); return; }
            const { uploadFile } = await import('./js/upload.js');
            try {
                const imageURL = await uploadFile(file);
                const { sendMessage } = await import('./js/chat.js');
                await sendMessage(window.currentConvoId, '', imageURL);
                this.value = '';
            } catch (e) {
                alert('फोटो अपलोड फेल: ' + e.message);
            }
        });

        window.currentConvoId = null;
    </script>
</body>
</html>
