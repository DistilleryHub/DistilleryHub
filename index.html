<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1325">
<!-- Tells Chrome/Android this page manages its own light/dark styling,
     so the OS-level "Force Dark" auto-invert never overrides our colors
     (that was causing white search bars / washed-out names before). -->
<meta name="color-scheme" content="dark light">
<meta name="description" content="DistilleryHub — professional social network for distillery, ethanol, laboratory and plant professionals.">
<title>DistilleryHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/DistilleryHub/manifest.json">
<!-- iOS: true fullscreen standalone PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DistilleryHub">
<!-- Android/Chrome: standalone PWA -->
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/DistilleryHub/icon-192.png">
<script type="text/javascript">
  (function (l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&');
      }).join('?');
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
  }(window.location));
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/main.jsx"></script>
</body>
</html>
