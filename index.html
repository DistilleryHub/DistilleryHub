<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistilleryHub</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">DH</div>
            <h2>DistilleryHub</h2>
            <p>Professional Network for Distillery & Ethanol Experts</p>
            <input type="email" id="signinEmail" placeholder="Email">
            <input type="password" id="signinPassword" placeholder="Password">
            <button id="signinBtn" onclick="handleSignIn()">Sign In</button>
            <button onclick="handleGoogleSignIn()">Continue with Google</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="app-shell" style="display:none;">
        <div class="topbar">
            <div class="brand">
                <div class="brand-icon">DH</div>
                <div class="brand-name">DistilleryHub</div>
            </div>
            <div class="top-actions">
                <button onclick="switchTab('feed')">Feed</button>
                <button onclick="switchTab('network')">Network</button>
                <button onclick="switchTab('jobs')">Jobs</button>
                <button onclick="switchTab('chat')">Chat</button>
                <button onclick="handleSignOut()">Logout</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <div class="side-card">
                    <div class="side-avatar">U</div>
                    <div class="side-name" id="sideName">User</div>
                    <div class="side-headline" id="sideHeadline">Distiller</div>
                    <button class="btn btn-primary btn-block" onclick="openProfile()">View Profile</button>
                </div>
                <div class="side-card">
                    <h4>Quick Links</h4>
                    <button class="side-link" onclick="switchTab('jobs')">Browse Jobs</button>
                    <button class="side-link" onclick="switchTab('articles')">Articles</button>
                    <button class="side-link" onclick="switchTab('network')">Network</button>
                </div>
            </div>

            <div class="content">
                <div id="panel-feed" class="panel active">
                    <div class="composer">
                        <textarea id="postText" placeholder="Share an update..."></textarea>
                        <div class="composer-actions">
                            <button onclick="document.getElementById('postImgInput').click()">📷 Photo</button>
                            <input type="file" id="postImgInput" accept="image/*" style="display:none;">
                            <button class="btn-primary" onclick="submitPost()">Post</button>
                        </div>
                    </div>
                    <div id="feedList" class="feed-list"></div>
                </div>

                <div id="panel-network" class="panel" style="display:none;">
                    <div id="networkList" class="people-list"></div>
                </div>

                <div id="panel-jobs" class="panel" style="display:none;">
                    <div id="jobsList" class="grid-list"></div>
                </div>

                <div id="panel-chat" class="panel" style="display:none;">
                    <div class="chat-interface">
                        <div class="chat-list" id="convoList"></div>
                        <div class="chat-window" id="chatWindow">
                            <div class="chat-header" id="chatHeader">Select a conversation</div>
                            <div class="chat-messages" id="chatMessages"></div>
                            
                            <!-- नया "+" बटन और फाइल इनपुट जोड़ा गया है -->
                            <div class="input-area">
                                <button id="btnChatAttach" style="background:none; border:none; font-size:20px; cursor:pointer;">➕</button>
                                <input type="file" id="chatImgInput" accept="image/*" style="display:none;">
                                <input type="text" id="chatInput" placeholder="Write a message...">
                                <button onclick="sendChatMessage()">➤</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { auth } from './js/firebase-init.js';

        // Auth Functions
        window.handleSignIn = async function() {
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;
            try {
                const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                alert('Login Successful');
            } catch (e) {
                alert('Login Failed: ' + e.message);
            }
        };

        window.handleGoogleSignIn = async function() {
            try {
                const { GoogleAuthProvider, signInWithPopup } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                alert('Login Successful');
            } catch (e) {
                alert('Login Failed: ' + e.message);
            }
        };

        window.handleSignOut = async function() {
            const { signOut } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
            await signOut(auth);
            document.getElementById('app').style.display = 'none';
            document.getElementById('authScreen').style.display = 'block';
        };

        // Tab Switching
        window.switchTab = function(tab) {
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            document.getElementById('panel-' + tab).style.display = 'block';
        };

        // Post Function (Text + Image)
        window.submitPost = async function() {
            const text = document.getElementById('postText').value.trim();
            const imgInput = document.getElementById('postImgInput');
            const file = imgInput && imgInput.files[0];

            if (!text && !file) return alert('कुछ लिखो या फोटो चुनो');

            let imageURL = '';
            if (file) {
                const { uploadFile } = await import('./js/upload.js');
                try { imageURL = await uploadFile(file); } 
                catch (e) { return alert('Upload failed: ' + e.message); }
            }

            const { postText: postFn } = await import('./js/feed.js');
            await postFn(text, imageURL);
            document.getElementById('postText').value = '';
            if (imgInput) imgInput.value = '';
        };

        // Chat Send Function (Text + Image)
        window.sendChatMessage = async function() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            const fileInput = document.getElementById('chatImgInput');
            const file = fileInput && fileInput.files[0];

            if (!text && !file) return;

            if (!window.currentConvoId) return alert('पहले चैट सेलेक्ट करो');

            let imageURL = '';
            if (file) {
                const { uploadFile } = await import('./js/upload.js');
                try { imageURL = await uploadFile(file); } 
                catch (e) { return alert('Image upload failed: ' + e.message); }
            }

            const { sendMessage } = await import('./js/chat.js');
            await sendMessage(window.currentConvoId, text, imageURL);
            input.value = '';
            if (fileInput) fileInput.value = '';
        };

        // Global State
        window.currentConvoId = null;
    </script>
</body>
</html>
